<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>لوحة التحكم | سيراميكا الزهراء</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <header class="admin__bar">
    <div class="admin__brand">
      <img src="assets/images/logo.png" alt="">
      <strong>لوحة التحكم</strong>
    </div>
    <div class="admin__actions">
      <a href="/">الموقع</a>
      <button type="button" id="logout">خروج</button>
    </div>
  </header>

  <div class="admin__wrap">
    <nav class="admin__tabs">
      <button type="button" class="is-active" data-tab="overview">نظرة عامة</button>
      <button type="button" data-tab="messages">الرسائل <span class="badge-count" id="unreadBadge" hidden></span></button>
      <button type="button" data-tab="users">المستخدمون</button>
      <button type="button" data-tab="settings">الإعدادات</button>
    </nav>
    <main id="view"></main>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
