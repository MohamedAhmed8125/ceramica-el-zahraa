<!DOCTYPE html>
<html lang="ar" dir="rtl" data-title="forgotTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ceramica El-Zahraa</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="/" class="auth-logo"><img src="assets/images/logo.png" alt="Ceramica El-Zahraa"></a>
    <div class="lang auth-lang" role="group">
      <button type="button" data-lang="ar">عربي</button>
      <button type="button" data-lang="en">EN</button>
    </div>

    <h1 class="auth-title" data-i18n="forgotTitle"></h1>
    <p class="auth-text" data-i18n="forgotText"></p>

    <form id="forgotForm" novalidate>
      <label class="field">
        <span data-i18n="email"></span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <p class="form-error" id="formMsg" role="alert" hidden></p>
      <button type="submit" class="btn btn--primary auth-submit" data-i18n="sendLink"></button>
    </form>
    <p class="auth-foot"><a href="login.html" data-i18n="backToLogin"></a></p>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/recover.js"></script>
</body>
</html>
